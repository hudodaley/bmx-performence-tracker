<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your BMX PB's</title>
  <style>
    /* Full Black Background */
    body {
      background-color: #000000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      color: #CCFF00;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Outer Wrapper for Side Photos + Main Container */
    .page-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      width: 100%;
      max-width: 1100px;
    }

    /* Side Image Styling */
    .side-photo {
      width: 220px;
      height: 380px;
      object-fit: cover;
      border-radius: 15px;
      border: 2px solid #CCFF00;
      box-shadow: 0 0 15px rgba(204, 255, 0, 0.2);
    }

    @media (max-width: 768px) {
      .side-photo {
        display: none;
      }
    }

    /* Main Container */
    .container {
      background-color: #111111;
      width: 100%;
      max-width: 480px;
      padding: 25px;
      border-radius: 20px;
      border: 2px solid #CCFF00;
      box-shadow: 0 0 20px rgba(204, 255, 0, 0.2);
      text-align: center;
    }

    /* Header Styling */
    h1 {
      margin: 0 0 8px 0;
      font-size: 28px;
      letter-spacing: 1px;
      color: #CCFF00;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 13px;
      color: #CCFF00;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    /* Input & Selectors */
    .selector-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    label {
      font-size: 12px;
      text-align: left;
      font-weight: bold;
      color: #CCFF00;
      margin-bottom: -6px;
      text-transform: uppercase;
    }

    select, input {
      background-color: #1a1a1a;
      color: #CCFF00;
      border: 2px solid #CCFF00;
      padding: 12px 15px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      outline: none;
      width: 100%;
      box-sizing: border-box;
    }

    select:focus, input:focus {
      box-shadow: 0 0 10px rgba(204, 255, 0, 0.5);
    }

    /* Button Styling */
    .btn {
      background-color: #CCFF00;
      color: #000000;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      margin-top: 5px;
    }

    .btn:hover {
      background-color: #b3e600;
      box-shadow: 0 0 12px rgba(204, 255, 0, 0.6);
    }

    .divider {
      border-top: 1px dashed #333;
      margin: 20px 0;
    }

    /* Cards Styling */
    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background-color: #1a1a1a;
      border: 1px solid #333333;
      padding: 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 14px;
      color: #CCFF00;
      text-transform: uppercase;
      font-weight: 600;
    }

    .card-value {
      font-size: 26px;
      font-weight: bold;
      color: #CCFF00;
    }

    /* Status Indicator */
    #status {
      font-size: 12px;
      color: #CCFF00;
      margin-top: 15px;
      font-weight: bold;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <img class="side-photo" src="https://images.unsplash.com/photo-1544197150-b99a580bb7a8?auto=format&fit=crop&w=400&q=80" alt="BMX Left Side Photo">

    <div class="container">
      <h1>Your BMX PB's</h1>
      <div class="subtitle">Don't go searching for your pb's for hours go to Your BMX PB's</div>

      <div class="selector-group">
        <label for="track-select">Select Club / Track:</label>
        <select id="track-select" onchange="loadClubData()">
          <option value="">-- Choose a Club --</option>
          <option value="rockybmx">Rockhampton BMX</option>
          <option value="harbourcity">Harbour City BMX</option>
          <option value="cairns">Cairns BMX</option>
          <option value="moranbah">Moranbah BMX club</option>
          <option value="bmxch">Central Highlands BMX club</option>
        </select>

        <label for="rider-select">Select Rider:</label>
        <select id="rider-select" onchange="calculateRiderPBs()">
          <option value="">-- Select a Club First --</option>
        </select>
      </div>

      <div class="divider"></div>

      <div class="selector-group">
        <label for="transponder-input">Or Search By Transponder / Sqorz ID:</label>
        <input type="text" id="transponder-input" placeholder="e.g. TX-12345 or Sqorz ID">
        <button class="btn" onclick="lookupTransponderPBs()">Find My Session PBs</button>
      </div>

      <div class="cards-container">
        <div class="card">
          <div class="card-title">Gate PB</div>
          <div class="card-value" id="gate-pb">--</div>
        </div>

        <div class="card">
          <div class="card-title">

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your BMX PB's</title>
  <style>
    /* Full Black Background */
    body {
      background-color: #000000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      color: #CCFF00;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Main Container */
    .container {
      background-color: #111111;
      width: 100%;
      max-width: 480px;
      padding: 25px;
      border-radius: 20px;
      border: 2px solid #CCFF00;
      box-shadow: 0 0 20px rgba(204, 255, 0, 0.2);
      text-align: center;
    }

    /* Header Styling */
    h1 {
      margin: 0 0 8px 0;
      font-size: 28px;
      letter-spacing: 1px;
      color: #CCFF00;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 13px;
      color: #CCFF00;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    /* Dropdown Selectors */
    .selector-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 25px;
    }

    label {
      font-size: 12px;
      text-align: left;
      font-weight: bold;
      color: #CCFF00;
      margin-bottom: -6px;
      text-transform: uppercase;
    }

    select {
      background-color: #1a1a1a;
      color: #CCFF00;
      border: 2px solid #CCFF00;
      padding: 12px 15px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      outline: none;
      width: 100%;
      cursor: pointer;
    }

    select:focus {
      box-shadow: 0 0 10px rgba(204, 255, 0, 0.5);
    }

    /* Cards Styling */
    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background-color: #1a1a1a;
      border: 1px solid #333333;
      padding: 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 14px;
      color: #CCFF00;
      text-transform: uppercase;
      font-weight: 600;
    }

    .card-value {
      font-size: 26px;
      font-weight: bold;
      color: #CCFF00;
    }

    /* Status Indicator */
    #status {
      font-size: 12px;
      color: #CCFF00;
      margin-top: 15px;
      font-weight: bold;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Your BMX PB's</h1>
    <div class="subtitle">Don't go searching for your pb's for hours go to Your BMX PB's</div>

    <div class="selector-group">
      <label for="track-select">Select Club / Track:</label>
      <select id="track-select" onchange="loadClubData()">
        <option value="">-- Choose a Club --</option>
        <option value="rockhampton">Rockhampton BMX</option>
        <option value="harbourcity">Harbour City BMX</option>
        <option value="cairns">Cairns BMX</option>
      </select>

      <label for="rider-select">Select Rider:</label>
      <select id="rider-select" onchange="calculateRiderPBs()">
        <option value="">-- Select a Club First --</option>
      </select>
    </div>

    <div class="cards-container">
      <div class="card">
        <div class="card-title">Gate PB</div>
        <div class="card-value" id="gate-pb">--</div>
      </div>

      <div class="card">
        <div class="card-title">Whole Lap PB</div>
        <div class="card-value" id="lap-pb">--</div>
      </div>
    </div>

    <div id="status">Select a club above to start loading riders...</div>
  </div>

  <script>
    const PROXY_URL = "https://sqorz-proxy.hudsondaley55.workers.dev";

    // --- CLUBS & EVENT IDs ---
    const CLUBS_DATA = {
      "rockhampton": {
        name: "Rockhampton BMX",
        events: [
          "6a06bedb106401f621fe2662",
          "6a0ff3b66075f1e7948d9259",
          "6a1929336075f61de2a545ac"
        ]
      },
      "harbourcity": {
        name: "Harbour City BMX",
        events: []
      },
      "cairns": {
        name: "Cairns BMX",
        events: []
      }
    };

    let ridersMap = {};

    async function fetchSqorzJson(urlPath) {
      const targetUrl = `https://our.sqorz.com${urlPath}`;
      const response = await fetch(`${PROXY_URL}?url=${encodeURIComponent(targetUrl)}`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.json();
    }

    async function loadClubData() {
      const statusEl = document.getElementById("status");
      const clubCode = document.getElementById("track-select").value;
      const riderSelect = document.getElementById("rider-select");

      document.getElementById("gate-pb").textContent = "--";
      document.getElementById("lap-pb").textContent = "--";

      if (!clubCode) {
        riderSelect.innerHTML = '<option value="">-- Select a Club First --</option>';
        statusEl.textContent = "Select a club above to start loading riders...";
        return;
      }

      const clubInfo = CLUBS_DATA[clubCode];
      riderSelect.innerHTML = '<option value="">-- Loading Riders... --</option>';
      statusEl.textContent = `Connecting to Sqorz for ${clubInfo.name}...`;
      ridersMap = {};

      try {
        let successCount = 0;

        // Try direct event IDs if listed
        if (clubInfo && clubInfo.events && clubInfo.events.length > 0) {
          for (let eventId of clubInfo.events) {
            const cleanId = eventId.replace(/[^a-zA-Z0-9]/g, "").trim();
            if (!cleanId) continue;

            try {
              // Correct Sqorz API endpoint for single event JSON
              const eventData = await fetchSqorzJson(`/json/event/${cleanId}`);
              deepScanForRiders(eventData);
              successCount++;
            } catch (e) {
              console.warn(`Could not fetch event ${cleanId}`, e);
            }
          }
        }

        // Fallback: If no event IDs or events came up empty, fetch entire organization feed directly from Sqorz
        if (Object.keys(ridersMap).length === 0) {
          try {
            statusEl.textContent = `Fetching club feed for ${clubCode}...`;
            const orgData = await fetchSqorzJson(`/json/org/${clubCode}`);
            deepScanForRiders(orgData);
            if (Object.keys(ridersMap).length > 0) successCount = 1;
          } catch (e) {
            console.warn(`Could not fetch org feed for ${clubCode}`, e);
          }
        }

        const sortedRiders = Object.keys(ridersMap).sort();

        if (sortedRiders.length === 0) {
          riderSelect.innerHTML = '<option value="">No Riders Found</option>';
          statusEl.textContent = "Could not find rider entries. Check event IDs or network proxy.";
          return;
        }

        riderSelect.innerHTML = '<option value="">-- Select a Rider --</option>';
        sortedRiders.forEach(rider => {
          const opt = document.createElement("option");
          opt.value = rider;
          opt.textContent = rider;
          riderSelect.appendChild(opt);
        });

        statusEl.textContent = `Loaded ${sortedRiders.length} riders!`;

      } catch (err) {
        console.error(err);
        statusEl.textContent = "Error fetching data from Sqorz.";
      }
    }

    // Universal Object & Array Traversal Scanner
    function deepScanForRiders(node) {
      if (!node) return;

      if (Array.isArray(node)) {
        for (let item of node) {
          deepScanForRiders(item);
        }
        return;
      }

      if (typeof node === 'object') {
        const name = extractRiderName(node);
        if (name) {
          const cleanName = formatName(name);
          if (!ridersMap[cleanName]) {
            ridersMap[cleanName] = { gates: [], laps: [] };
          }
          extractTimings(node, ridersMap[cleanName]);
        }

        for (let key in node) {
          if (node.hasOwnProperty(key) && typeof node[key] === 'object') {
            deepScanForRiders(node[key]);
          }
        }
      }
    }

    function extractRiderName(obj) {
      if (typeof obj.name === 'string' && isValidName(obj.name)) return obj.name;
      if (typeof obj.riderName === 'string' && isValidName(obj.riderName)) return obj.riderName;
      if (typeof obj.rider === 'string' && isValidName(obj.rider)) return obj.rider;
      if (typeof obj.fullName === 'string' && isValidName(obj.fullName)) return obj.fullName;

      const f = obj.fname || obj.firstName || obj.givenName;
      const l = obj.lname || obj.lastName || obj.familyName;
      if (typeof f === 'string' && typeof l === 'string') {
        const combined = `${f} ${l}`.trim();
        if (isValidName(combined)) return combined;
      }

      return null;
    }

    function isValidName(str) {
      if (!str) return false;
      const s = str.trim();
      if (s.length < 2) return false;
      
      const lower = s.toLowerCase();
      // Only block obvious event headings
      if (lower.includes("bmx club") || lower.includes("official result") || lower.includes("round ")) {
        return false;
      }
      return true;
    }

    function formatName(str) {
      return str.trim().toLowerCase().replace(/\b\w/g, l => l.toUpperCase());
    }

    function extractTimings(obj, riderRecord) {
      // Collect gate times (1.0s to 15.0s)
      const gateFields = [obj.gate, obj.gateTime, obj.split1, obj.split, obj.s1, obj.g, obj.split_1];
      gateFields.forEach(val => {
        const n = parseFloat(val);
        if (!isNaN(n) && n > 1.0 && n < 15.0) {
          riderRecord.gates.push(n);
        }
      });

      // Collect full lap times (15.0s to 120.0s)
      const lapFields = [obj.time, obj.lapTime, obj.totalTime, obj.result, obj.finish, obj.t, obj.total];
      lapFields.forEach(val => {
        const n = parseFloat(val);
        if (!isNaN(n) && n >= 15.0 && n < 120.0) {
          riderRecord.laps.push(n);
        }
      });
    }

    function calculateRiderPBs() {
      const selectedRider = document.getElementById("rider-select").value;
      if (!selectedRider || !ridersMap[selectedRider]) return;

      const riderData = ridersMap[selectedRider];

      const bestGate = riderData.gates.length > 0 ? Math.min(...riderData.gates) : null;
      const bestLap = riderData.laps.length > 0 ? Math.min(...riderData.laps) : null;

      document.getElementById("gate-pb").textContent = bestGate !== null ? bestGate.toFixed(3) + "s" : "N/A";
      document.getElementById("lap-pb").textContent = bestLap !== null ? bestLap.toFixed(3) + "s" : "N/A";
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your BMX PB's</title>

  <style>
    * { box-sizing: border-box; }

    body {
      background: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      color: #CCFF00;
      min-height: 100vh;
    }

    .page-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .container {
      background: #111;
      width: 100%;
      max-width: 500px;
      padding: 25px;
      border-radius: 20px;
      border: 2px solid #CCFF00;
      box-shadow: 0 0 25px rgba(204,255,0,0.2);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 30px;
      color: #CCFF00;
      text-transform: uppercase;
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      margin-top: 8px;
      margin-bottom: 5px;
    }

    .subtitle-small {
      text-align: center;
      font-size: 11px;
      opacity: 0.8;
      margin-bottom: 25px;
    }

    .selector-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 25px;
    }

    label {
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: -6px;
    }

    select {
      background: #1a1a1a;
      color: #CCFF00;
      border: 2px solid #CCFF00;
      padding: 12px 15px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      outline: none;
      width: 100%;
    }

    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 10px;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      padding: 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 14px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .card-value {
      font-size: 26px;
      font-weight: bold;
    }

    #status {
      font-size: 12px;
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="page-wrapper">
  <div class="container">

    <h1>Your BMX PB's</h1>

    <div class="subtitle">
      Don't go searching for your PB's for hours — go to Your BMX PB's
    </div>

    <div class="subtitle-small">
      ( MAY TAKE A WHILE TO LOAD, LOTS OF DATA TO GO THROUGH! )
    </div>

    <div id="our-sqorz">

      <div class="selector-group">

        <label for="track-select">Select Club / Track</label>
        <select id="track-select">
          <option value="">-- Choose a Club --</option>
          <option value="rockybmx">Rockhampton BMX</option>
          <option value="hcbmx">Harbour City BMX</option>
          <option value="cairnsbmx">Cairns BMX</option>
          <option value="moranbah">Moranbah BMX Club</option>
          <option value="bmxch">Central Highlands BMX Club</option>
        </select>

        <label for="rider-select">Select Rider</label>
        <select id="rider-select">
          <option value="">-- Select a Club First --</option>
        </select>

      </div>

      <div class="cards-container">
        <div class="card">
          <div class="card-title">Gate PB</div>
          <div class="card-value" id="gate-pb">--</div>
        </div>

        <div class="card">
          <div class="card-title">Whole Lap PB</div>
          <div class="card-value" id="lap-pb">--</div>
        </div>
      </div>

      <div id="status">Select a club above to load riders...</div>

    </div>

  </div>
</div>

<script>
/* =====================================================
   CLUBS
===================================================== */

const CLUBS = {
  rockybmx: "Rockhampton BMX",
  hcbmx: "Harbour City BMX",
  cairnsbmx: "Cairns BMX",
  moranbah: "Moranbah BMX Club",
  bmxch: "Central Highlands BMX Club"
};

/* =====================================================
   LOAD RIDERS (NEW WORKING METHOD)
===================================================== */

document.getElementById("track-select").addEventListener("change", async () => {
  const clubCode = document.getElementById("track-select").value;
  const riderSelect = document.getElementById("rider-select");
  const statusEl = document.getElementById("status");

  riderSelect.innerHTML = '<option>Loading...</option>';
  statusEl.textContent = "Loading riders...";

  if (!clubCode) {
    riderSelect.innerHTML = '<option>-- Select a Club First --</option>';
    statusEl.textContent = "Select a club above to load riders...";
    return;
  }

  try {
    const res = await fetch(`https://our.sqorz.com/json/org/${clubCode}`);
    const data = await res.json();

    const riders = new Set();

    function scan(node) {
      if (!node) return;

      if (Array.isArray(node)) {
        node.forEach(scan);
        return;
      }

      if (typeof node === "object") {
        if (node.name && typeof node.name === "string") {
          if (node.name.length > 3 && !node.name.includes("BMX")) {
            riders.add(node.name);
          }
        }

        for (const key in node) {
          if (typeof node[key] === "object") scan(node[key]);
        }
      }
    }

    scan(data);

    const sorted = [...riders].sort();

    riderSelect.innerHTML = '<option value="">-- Select a Rider --</option>';

    sorted.forEach(name => {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      riderSelect.appendChild(opt);
    });

    statusEl.textContent = `Loaded ${sorted.length} riders.`;

  } catch (err) {
    console.error(err);
    statusEl.textContent = "Error loading riders.";
    riderSelect.innerHTML = '<option>Error Loading Riders</option>';
  }
});

/* =====================================================
   LOAD PBs
===================================================== */

document.getElementById("rider-select").addEventListener("change", async () => {
  const riderName = document.getElementById("rider-select").value;
  const statusEl = document.getElementById("status");

  document.getElementById("gate-pb").textContent = "--";
  document.getElementById("lap-pb").textContent = "--";

  if (!riderName) {
    statusEl.textContent = "Select a rider to view PBs.";
    return;
  }

  statusEl.textContent = "Loading PBs...";

  try {
    const res = await fetch(`https://sqorz.com/api/rider/name/${encodeURIComponent(riderName)}/pbs`);
    const data = await res.json();

    document.getElementById("gate-pb").textContent = data.gate_pb ?? "--";
    document.getElementById("lap-pb").textContent = data.lap_pb ?? "--";

    statusEl.textContent = "PBs loaded successfully.";

  } catch (err) {
    console.error(err);
    statusEl.textContent = "Could not load PBs.";
  }
});
</script>

</body>
</html>

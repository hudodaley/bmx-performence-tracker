<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your BMX PB's</title>

  <style>
    * { box-sizing: border-box; }

    body {
      background: #000000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      color: #CCFF00;
      min-height: 100vh;
    }

    .page-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .container {
      background: #111111;
      width: 100%;
      max-width: 500px;
      padding: 25px;
      border-radius: 20px;
      border: 2px solid #CCFF00;
      box-shadow: 0 0 25px rgba(204, 255, 0, 0.2);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 30px;
      letter-spacing: 1px;
      color: #CCFF00;
      text-transform: uppercase;
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #CCFF00;
      margin-top: 8px;
      margin-bottom: 5px;
      line-height: 1.4;
    }

    .subtitle-small {
      text-align: center;
      font-size: 11px;
      color: #CCFF00;
      margin-bottom: 25px;
      opacity: 0.8;
    }

    .selector-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 25px;
    }

    label {
      font-size: 12px;
      font-weight: bold;
      color: #CCFF00;
      text-transform: uppercase;
      margin-bottom: -6px;
    }

    select {
      background: #1a1a1a;
      color: #CCFF00;
      border: 2px solid #CCFF00;
      padding: 12px 15px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      outline: none;
      width: 100%;
    }

    select:focus {
      box-shadow: 0 0 10px rgba(204, 255, 0, 0.5);
    }

    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 10px;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #333333;
      padding: 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 14px;
      color: #CCFF00;
      text-transform: uppercase;
      font-weight: 600;
    }

    .card-value {
      font-size: 26px;
      font-weight: bold;
      color: #CCFF00;
    }

    #status {
      font-size: 12px;
      color: #CCFF00;
      margin-top: 15px;
      font-weight: bold;
      line-height: 1.4;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="page-wrapper">
  <div class="container">

    <h1>Your BMX PB's</h1>

    <div class="subtitle">
      Don't go searching for your PB's for hours — go to Your BMX PB's
    </div>

    <div class="subtitle-small">
      ( MAY TAKE A WHILE TO LOAD, LOTS OF DATA TO GO THROUGH! )
    </div>

    <div id="our-sqorz">

      <div class="selector-group">

        <label for="track-select">Select Club / Track</label>
        <select id="track-select">
          <option value="">-- Choose a Club --</option>
          <option value="rockybmx">Rockhampton BMX</option>
          <option value="hcbmx">Harbour City BMX</option>
          <option value="cairnsbmx">Cairns BMX</option>
          <option value="moranbah">Moranbah BMX Club</option>
          <option value="bmxch">Central Highlands BMX Club</option>
        </select>

        <label for="rider-select">Select Rider</label>
        <select id="rider-select">
          <option value="">-- Select a Club First --</option>
        </select>

      </div>

      <div class="cards-container">
        <div class="card">
          <div class="card-title">Gate PB</div>
          <div class="card-value" id="gate-pb">--</div>
        </div>

        <div class="card">
          <div class="card-title">Whole Lap PB</div>
          <div class="card-value" id="lap-pb">--</div>
        </div>
      </div>

      <div id="status">Select a club above to load riders...</div>

    </div>

  </div>
</div>

<script>
/* =====================================================
   CONFIG — CLUBS
===================================================== */

const CLUBS = {
  rockybmx: "Rockhampton BMX",
  hcbmx: "Harbour City BMX",
  cairnsbmx: "Cairns BMX",
  moranbah: "Moranbah BMX Club",
  bmxch: "Central Highlands BMX Club"
};

/* =====================================================
   LOAD RIDERS WHEN CLUB IS SELECTED
===================================================== */

document.getElementById("track-select").addEventListener("change", async () => {
  const clubCode = document.getElementById("track-select").value;
  const riderSelect = document.getElementById("rider-select");
  const statusEl = document.getElementById("status");

  document.getElementById("gate-pb").textContent = "--";
  document.getElementById("lap-pb").textContent = "--";

  if (!clubCode) {
    riderSelect.innerHTML = '<option value="">-- Select a Club First --</option>';
    statusEl.textContent = "Select a club above to load riders...";
    return;
  }

  statusEl.textContent = `Loading riders from ${CLUBS[clubCode]}...`;
  riderSelect.innerHTML = '<option value="">Loading...</option>';

  try {
    const res = await fetch(`https://sqorz.com/api/club/${clubCode}/riders`);
    const data = await res.json();

    riderSelect.innerHTML = '<option value="">-- Select a Rider --</option>';

    data.riders.forEach(rider => {
      const opt = document.createElement("option");
      opt.value = rider.id;
      opt.textContent = rider.name;
      riderSelect.appendChild(opt);
    });

    statusEl.textContent = `Loaded ${data.riders.length} riders.`;

  } catch (err) {
    console.error(err);
    statusEl.textContent = "Could not load riders for this club.";
    riderSelect.innerHTML = '<option value="">Error Loading Riders</option>';
  }
});

/* =====================================================
   LOAD PBs WHEN RIDER IS SELECTED
===================================================== */

document.getElementById("rider-select").addEventListener("change", async () => {
  const riderId = document.getElementById("rider-select").value;
  const statusEl = document.getElementById("status");

  document.getElementById("gate-pb").textContent = "--";
  document.getElementById("lap-pb").textContent = "--";

  if (!riderId) {
    statusEl.textContent = "Select a rider to view PBs.";
    return;
  }

  statusEl.textContent = "Loading PBs...";

  try {
    const res = await fetch(`https://sqorz.com/api/rider/${riderId}/pbs`);
    const data = await res.json();

    document.getElementById("gate-pb").textContent = data.gate_pb ?? "--";
    document.getElementById("lap-pb").textContent = data.lap_pb ?? "--";

    statusEl.textContent = "PBs loaded successfully.";

  } catch (err) {
    console.error(err);
    statusEl.textContent = "Could not load PBs for this rider.";
  }
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your BMX PB's</title>
  <style>
    /* Full Black Background */
    body {
      background-color: #000000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      color: #CCFF00;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Main Container */
    .container {
      background-color: #111111;
      width: 100%;
      max-width: 480px;
      padding: 25px;
      border-radius: 20px;
      border: 2px solid #CCFF00;
      box-shadow: 0 0 20px rgba(204, 255, 0, 0.2);
      text-align: center;
    }

    /* Header Styling */
    h1 {
      margin: 0 0 8px 0;
      font-size: 28px;
      letter-spacing: 1px;
      color: #CCFF00;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 13px;
      color: #CCFF00;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    /* Dropdown Selectors */
    .selector-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 25px;
    }

    label {
      font-size: 12px;
      text-align: left;
      font-weight: bold;
      color: #CCFF00;
      margin-bottom: -6px;
      text-transform: uppercase;
    }

    select {
      background-color: #1a1a1a;
      color: #CCFF00;
      border: 2px solid #CCFF00;
      padding: 12px 15px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      outline: none;
      width: 100%;
      cursor: pointer;
    }

    select:focus {
      box-shadow: 0 0 10px rgba(204, 255, 0, 0.5);
    }

    /* Cards Styling */
    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background-color: #1a1a1a;
      border: 1px solid #333333;
      padding: 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 14px;
      color: #CCFF00;
      text-transform: uppercase;
      font-weight: 600;
    }

    .card-value {
      font-size: 26px;
      font-weight: bold;
      color: #CCFF00;
    }

    /* Status Indicator */
    #status {
      font-size: 12px;
      color: #CCFF00;
      margin-top: 15px;
      font-weight: bold;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Your BMX PB's</h1>
    <div class="subtitle">Don't go searching for your pb's for hours go to Your BMX PB's</div>

    <div class="selector-group">
      <label for="track-select">Select Club / Track:</label>
      <select id="track-select" onchange="loadClubData()">
        <option value="">-- Choose a Club --</option>
        <option value="rockhampton">Rockhampton BMX</option>
        <option value="harbourcity">Harbour City BMX</option>
        <option value="cairns">Cairns BMX</option>
      </select>

      <label for="rider-select">Select Rider:</label>
      <select id="rider-select" onchange="calculateRiderPBs()">
        <option value="">-- Select a Club First --</option>
      </select>
    </div>

    <div class="cards-container">
      <div class="card">
        <div class="card-title">Gate PB</div>
        <div class="card-value" id="gate-pb">--</div>
      </div>

      <div class="card">
        <div class="card-title">Whole Lap PB</div>
        <div class="card-value" id="lap-pb">--</div>
      </div>
    </div>

    <div id="status">Select a club above to start loading riders...</div>
  </div>

  <script>
    const PROXY_URL = "https://sqorz-proxy.hudsondaley55.workers.dev";

    // --- MAKE SURE YOUR EVENT IDs ARE IN QUOTES WITH COMMAS ---
    const CLUBS_DATA = {
      "rockhampton": {
        name: "Rockhampton BMX",
        events: [
          "6a06bedb106401f621fe2662"
        ]
      },
      "harbourcity": {
        name: "Harbour City BMX",
        events: []
      },
      "cairns": {
        name: "Cairns BMX",
        events: []
      }
    };

    let ridersMap = {};

    async function loadClubData() {
      const statusEl = document.getElementById("status");
      const clubCode = document.getElementById("track-select").value;
      const riderSelect = document.getElementById("rider-select");

      // Reset display
      document.getElementById("gate-pb").textContent = "--";
      document.getElementById("lap-pb").textContent = "--";

      if (!clubCode) {
        riderSelect.innerHTML = '<option value="">-- Select a Club First --</option>';
        statusEl.textContent = "Select a club above to start loading riders...";
        return;
      }

      const clubInfo = CLUBS_DATA[clubCode];
      if (!clubInfo || !clubInfo.events || clubInfo.events.length === 0) {
        statusEl.textContent = `No event IDs added for ${clubCode} yet in CLUBS_DATA.`;
        riderSelect.innerHTML = '<option value="">-- No Events Listed --</option>';
        return;
      }

      riderSelect.innerHTML = '<option value="">-- Loading Riders... --</option>';
      statusEl.textContent = `Loading ${clubInfo.events.length} event(s) for ${clubInfo.name}...`;
      ridersMap = {};

      try {
        for (let eventId of clubInfo.events) {
          const cleanEventId = eventId.replace("https://our.sqorz.com/api/v1/event/", "").replace(".json", "").trim();
          const targetUrl = `https://our.sqorz.com/api/v1/event/${cleanEventId}.json`;
          
          const response = await fetch(`${PROXY_URL}?url=${encodeURIComponent(targetUrl)}`);
          if (response.ok) {
            const eventData = await response.json();
            scanObjectForRiders(eventData);
          }
        }

        const sortedRiders = Object.keys(ridersMap).sort();

        if (sortedRiders.length === 0) {
          riderSelect.innerHTML = '<option value="">No Riders Found</option>';
          statusEl.textContent = "Connected to event, but found no timing records.";
          return;
        }

        riderSelect.innerHTML = '<option value="">-- Select a Rider --</option>';
        sortedRiders.forEach(rider => {
          const opt = document.createElement("option");
          opt.value = rider;
          opt.textContent = rider;
          riderSelect.appendChild(opt);
        });

        // Pre-select Hudson Daley if present
        const hudsonMatch = sortedRiders.find(r => r.toLowerCase().includes("hudson") && r.toLowerCase().includes("daley"));
        if (hudsonMatch) {
          riderSelect.value = hudsonMatch;
          calculateRiderPBs();
        }

        statusEl.textContent = `Loaded ${sortedRiders.length} riders across ${clubInfo.events.length} event(s)!`;

      } catch (err) {
        console.error(err);
        statusEl.textContent = "Error loading event data from Sqorz proxy.";
      }
    }

    function extractName(obj) {
      if (!obj || typeof obj !== 'object') return null;

      if (typeof obj.name === 'string' && obj.name.trim().length > 2) return obj.name.trim();
      if (typeof obj.riderName === 'string' && obj.riderName.trim().length > 2) return obj.riderName.trim();
      if (typeof obj.rider === 'string' && obj.rider.trim().length > 2) return obj.rider.trim();
      if (typeof obj.fullName === 'string' && obj.fullName.trim().length > 2) return obj.fullName.trim();

      const fname = obj.fname || obj.firstName || obj.givenName;
      const lname = obj.lname || obj.lastName || obj.familyName;
      if (fname && lname && typeof fname === 'string' && typeof lname === 'string') {
        return `${fname.trim()} ${lname.trim()}`;
      }

      return null;
    }

    function scanObjectForRiders(obj) {
      if (!obj || typeof obj !== 'object') return;

      const name = extractName(obj);

      if (name) {
        const cleanName = name.toLowerCase().replace(/\b\w/g, l => l.toUpperCase());

        if (!ridersMap[cleanName]) {
          ridersMap[cleanName] = { gates: [], laps: [] };
        }

        // Gate times (1.0s to 15.0s)
        [obj.gate, obj.gateTime, obj.split1, obj.split, obj.s1, obj.g].forEach(val => {
          const num = parseFloat(val);
          if (!isNaN(num) && num > 0 && num < 15) ridersMap[cleanName].gates.push(num);
        });

        // Full Lap times (>= 15.0s)
        [obj.time, obj.lapTime, obj.totalTime, obj.result, obj.finish, obj.t].forEach(val => {
          const num = parseFloat(val);
          if (!isNaN(num) && num >= 15) ridersMap[cleanName].laps.push(num);
        });
      }

      for (let k in obj) {
        if (obj.hasOwnProperty(k)) scanObjectForRiders(obj[k]);
      }
    }

    function calculateRiderPBs() {
      const selectedRider = document.getElementById("rider-select").value;
      if (!selectedRider || !ridersMap[selectedRider]) return;

      const riderData = ridersMap[selectedRider];

      const bestGate = riderData.gates.length > 0 ? Math.min(...riderData.gates) : null;
      const bestLap = riderData.laps.length > 0 ? Math.min(...riderData.laps) : null;

      document.getElementById("gate-pb").textContent = bestGate !== null ? bestGate.toFixed(3) + "s" : "N/A";
      document.getElementById("lap-pb").textContent = bestLap !== null ? bestLap.toFixed(3) + "s" : "N/A";
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your BMX Performance</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #080c0e;
            color: white;
        }

        header {
            padding: 30px 20px;
            text-align: center;
            background: #050708;
            border-bottom: 2px solid #13c8d4;
        }

        .logo {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .tagline {
            color: #13c8d4;
            margin-top: 8px;
            font-weight: bold;
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        .selectors {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: #11171a;
            border: 1px solid #263136;
            border-radius: 15px;
            padding: 20px;
        }

        label {
            display: block;
            color: #8c989d;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 14px;
            background: #080c0e;
            color: white;
            border: 1px solid #39464b;
            border-radius: 8px;
            font-size: 16px;
        }

        .rider {
            font-size: 34px;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .stat-title {
            color: #aab5b9;
            font-size: 14px;
            font-weight: bold;
        }

        .stat-number {
            font-size: 48px;
            font-weight: 900;
            margin: 10px 0;
        }

        .unit {
            color: #899499;
            font-size: 13px;
        }

        .green {
            color: #25d6a1;
            font-weight: bold;
        }

        h2 {
            margin-top: 30px;
        }

        .history {
            width: 100%;
            border-collapse: collapse;
        }

        .history th,
        .history td {
            padding: 13px 8px;
            text-align: left;
            border-bottom: 1px solid #273136;
        }

        .history th {
            color: #7f8b90;
            font-size: 12px;
        }

        .empty {
            color: #7f8b90;
            text-align: center;
            padding: 30px;
        }

        @media (max-width: 650px) {
            .selectors,
            .stats {
                grid-template-columns: 1fr;
            }

            .logo {
                font-size: 28px;
            }

            .rider {
                font-size: 27px;
            }

            .stat-number {
                font-size: 40px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo"> Your BMX PERFORMANCE</div>
    <div class="tagline">Be your best.</div>
</header>

<main>

    <div class="selectors">

        <div class="card">
            <label>CHOOSE RIDER</label>

            <select id="rider">
                <option>Hudson Daley</option>
            </select>
        </div>

        <div class="card">
            <label>CHOOSE TRACK</label>

            <select id="track">
                <option>Rockhampton BMX</option>
            </select>
        </div>

    </div>

    <div class="card">

        <div class="rider">Hudson Daley</div>

        <div style="color:#13c8d4;font-weight:bold;">
            ROCKHAMPTON BMX
        </div>

        <div class="stats">

            <div class="card">
                <div class="stat-title">🚦 BEST GATE PB</div>

                <div class="stat-number">
                    --
                </div>

                <div class="unit">
                    SECONDS
                </div>

                <p class="green">
                    Waiting for SQORZ data
                </p>
            </div>

            <div class="card">
                <div class="stat-title">🏁 RACE LAP PB</div>

                <div class="stat-number">
                    --
                </div>

                <div class="unit">
                    SECONDS
                </div>

                <p class="green">
                    Waiting for SQORZ data
                </p>
            </div>

        </div>

    </div>

    <h2>📈 </h2>

    <div class="card">

        <p>
        
            <strong>Waiting for data</strong>
        </p>

        <p>
            
            <strong>Waiting for data</strong>
        </p>

    </div>

    <

    <div class="card">

        <table class="history">

            <thead>
                <tr>
                    <th>DATE</th>
                    <th>SOURCE</th>
                    <th>TYPE</th>
                    <th>TIME</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td colspan="4" class="empty">
                        No SQORZ results connected yet.
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</main>
<script src="data.js"></script>
<script src="sqorz.js"></script>
</body>
</html>
